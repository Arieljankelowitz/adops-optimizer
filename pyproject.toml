[project]
name = "adops-optimizer"
version = "0.1.0"
description = "Turns a daily ad-performance export into a short, evidence-linked optimization report."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "altair>=6.3.0",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "pandas>=2.2",
    "pydantic>=2.9",
    "pyyaml>=6.0.3",
    "streamlit>=1.66.1",
]

[dependency-groups]
deploy = [
    "modal>=1.6.2",
]
dev = [
    "pytest>=8.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib -m 'not live and not fullsize'"
markers = [
    "live: opt-in tests that call a real self-hosted model endpoint",
    "fullsize: opt-in offline run on a generated ~116,000-row synthetic export (minutes)",
]
