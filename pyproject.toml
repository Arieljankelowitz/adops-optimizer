[project]
name = "adops-optimizer"
version = "0.1.0"
description = "Turns a daily ad-performance export into a short, evidence-linked optimization report."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib -m 'not live'"
markers = [
    "live: opt-in tests that call a real self-hosted model endpoint",
]
